<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

  <!-- Bootstrap JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Custom CSS -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/baseadmin.css') }}">

  <title>{% block title %}Admin Home Page{% endblock %}</title>
  {% block head %}{% endblock %}
</head>

<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark px-4">
    <a class="navbar-brand fw-bold text-white" href="{{ url_for('admin.admin_dashboard') }}">Student Management App</a>

    <!-- Toggle button for mobile -->
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
      aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse justify-content-between" id="navbarNav">

      <!-- Left nav links -->
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item">
          <a class="nav-link active" href="{{ url_for('admin.admin_dashboard') }}">Home</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="{{ url_for('admin.manage_faculty') }}">Manage Faculty</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="{{ url_for('admin.manage_student') }}">Manage Student</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="{{ url_for('admin.manage_subject') }}">Subjects</a>
        </li>
      </ul>

      <!-- Right nav (avatar + logout) -->
      <ul class="navbar-nav mb-2 mb-lg-0 d-flex align-items-center">
        <li class="nav-item d-flex align-items-center me-3">
          <a href="{{ url_for('faculty.profile') }}" title="Edit Profile">
            <img src="{{ url_for('static', filename='images/avtar.png') }}" alt="Edit Profile"
              class="rounded-pill" width="30" height="30">
          </a>
          <span class="navbar-text text-white px-2 fw-semibold d-none d-lg-inline">Welcome Admin</span>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="{{ url_for('auth.logout') }}">Logout</a>
        </li>
      </ul>
    </div>
  </nav>

  <!-- Page Content -->
  <div class="container-fluid mt-4">
    {% block content %}{% endblock %}
  </div>

</body>

</html>
